<!-- On lit les signaux avec () : Angular ne met à jour ces variables CSS que lorsque la souris bouge -->
<div
  class="cyber-shell"
  [style.--mx.px]="cursorPxX()"
  [style.--my.px]="cursorPxY()"
  [style.--px.%]="mouseX()"
  [style.--py.%]="mouseY()"
>
  <!-- Arrière-plan interactif : grille néon + faisceaux laser qui suivent la souris -->
  <div class="laser-backdrop" aria-hidden="true">
    <div class="grid-base"></div>
    <div class="grid-illuminated"></div>
    <div class="laser-beam-h"></div>
    <div class="laser-beam-v"></div>
    <div class="laser-scanline"></div>
  </div>

  <!-- Barre de navigation supérieure persistante -->
  <nav class="cyber-topbar">
    <div class="topbar-left">
      <a routerLink="/pollutions" class="brand-link">
        <span class="brand-pulse"></span>
        <span class="brand-code">SYS.POLLUTION // 2077</span>
      </a>
      <span class="status-tag" [class.online]="isLoggedIn()">
        {{ isLoggedIn() ? 'OPÉRATEUR : ' + operatorName() : 'ACCÈS RESTREINT' }}
      </span>
    </div>

    <div class="topbar-right">
      @if (!isLoggedIn()) {
        <a routerLink="/signup" class="hud-icon-btn login-btn" title="S'inscrire / Se connecter">
          <svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span>CONNEXION / INSCRIPTION</span>
        </a>
      } @else {
        <a routerLink="/signup" class="hud-icon-btn account-btn" title="Profil / Changer de compte">
          <svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span>COMPTE</span>
        </a>

        <button
          type="button"
          (click)="logout()"
          class="hud-icon-btn logout-btn"
          title="Se déconnecter"
        >
          <svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>DÉCONNEXION</span>
        </button>
      }
    </div>
  </nav>

  <!-- Contenu des pages -->
  <main class="cyber-viewport">
    <router-outlet></router-outlet>
  </main>
</div>
